name: Validate Universal MP4 Player

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app assets and JavaScript
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          node --check app.js
      - name: Check local asset references
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  for key in ("src","href"):
                      value=a.get(key,"")
                      if value and not value.startswith(("http://","https://","//","#","data:","mailto:","tel:","javascript:")):
                          path=value.split("?",1)[0].split("#",1)[0]
                          if path and not path.endswith((".css",".js")):
                              self.refs.append(path)
          p=Assets()
          p.feed(Path("index.html").read_text(encoding="utf-8"))
          missing=[ref for ref in p.refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit("Missing local assets: "+", ".join(missing))
          print(f"Checked {len(p.refs)} local asset references.")
          PY
